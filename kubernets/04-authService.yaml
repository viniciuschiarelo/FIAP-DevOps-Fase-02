apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth
spec:
  # Sem "replicas": quem controla a quantidade de pods é o KEDA (ScaledObject abaixo).
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          envFrom:
            - configMapRef:
                name: configmap
            - secretRef:
                name: mysecret
          image: 217140917440.dkr.ecr.us-east-1.amazonaws.com/auth-image:latest
          readinessProbe:          # "pronto para receber tráfego?" Se falhar, o Service para de mandar requisições
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:           # "está vivo?" Se falhar várias vezes, o kubelet reinicia o container
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8001

---
# Service ClusterIP: IP e DNS estáveis. O selector precisa bater com o label do Pod (app: auth).
# Outros namespaces chamam: http://auth.auth.svc.cluster.local:8001
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: auth
spec:
  selector:
    app: auth
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

---
# KEDA: escala pelo uso de CPU (% do requests.cpu do container). Precisa do metrics-server.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: auth
  namespace: auth
spec:
  scaleTargetRef:
    name: auth
  minReplicaCount: 2
  maxReplicaCount: 8
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
