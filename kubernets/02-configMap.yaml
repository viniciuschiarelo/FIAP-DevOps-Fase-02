# ConfigMap: dados NÃO sensíveis (portas, URLs internas, nomes de recursos AWS).
# A URL de outro microserviço usa o DNS do Service do Kubernetes, NÃO o IP do Pod.
# Formato: http://<nome-do-service>.<namespace>.svc.cluster.local:<porta>
# Ex.: o flag-service chama o auth pelo Service "auth" no namespace "auth".
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: auth
data:
  PORT: "8001"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: flag
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://auth.auth.svc.cluster.local:8001"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: targeting
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth.auth.svc.cluster.local:8001"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: evaluation
data:
  PORT: "8004"
  FLAG_SERVICE_URL: "http://flag.flag.svc.cluster.local:8002"
  TARGETING_SERVICE_URL: "http://targeting.targeting.svc.cluster.local:8003"
  AWS_REGION: "us-east-1"
  SQS_ENDPOINT: "http://host.docker.internal:9324"
  AWS_SQS_URL: "http://host.docker.internal:9324/000000000000/sua-fila"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: analytics
data:
  PORT: "8005"
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  DYNAMODB_ENDPOINT: "http://host.docker.internal:8000"
  SQS_ENDPOINT: "http://host.docker.internal:9324"
  AWS_SQS_URL: "http://host.docker.internal:9324/000000000000/sua-fila"
