# Secret: credenciais e connection strings.
# Os bancos ainda estão no docker-compose (portas publicadas no host).
# host.docker.internal (Docker Desktop) aponta do cluster para a máquina onde o Compose está rodando.
apiVersion: v1
kind: Secret
metadata:
  name: mysecret
  namespace: auth
type: Opaque
stringData:
  MASTER_KEY: admin-secreto-123
  DATABASE_URL: postgres://authuser:authuser@host.docker.internal:5438/authuser?sslmode=disable

---

