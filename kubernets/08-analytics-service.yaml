apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: analytics
spec:
  # Sem "replicas": quem controla a quantidade de pods é o KEDA (ScaledObject abaixo).
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          imagePullPolicy: Never
          image: fiap-techchallenge-fase02-analytics-service:latest
          envFrom:
            - configMapRef:
                name: configmap
            - secretRef:
                name: mysecret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8005

---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: analytics
spec:
  selector:
    app: analytics
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8005
      targetPort: 8005

---
# Credenciais AWS que o KEDA usa para ler o tamanho da fila (vêm do Secret do namespace).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: aws-credentials
  namespace: analytics
spec:
  secretTargetRef:
    - parameter: awsAccessKeyID
      name: mysecret
      key: AWS_ACCESS_KEY_ID
    - parameter: awsSecretAccessKey
      name: mysecret
      key: AWS_SECRET_ACCESS_KEY

---
# KEDA: o analytics só consome a fila, então escala pela quantidade de mensagens no SQS.
# queueLength: "5" => 1 pod para cada 5 mensagens pendentes.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics
  namespace: analytics
spec:
  scaleTargetRef:
    name: analytics
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: aws-credentials
      metadata:
        queueURL: "http://host.docker.internal:9324/000000000000/sua-fila"
        queueLength: "5"
        awsRegion: "us-east-1"
        awsEndpoint: "http://host.docker.internal:9324"
