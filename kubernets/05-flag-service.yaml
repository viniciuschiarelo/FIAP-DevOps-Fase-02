apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag
  namespace: flag
spec:
  # Sem "replicas": quem controla a quantidade de pods é o KEDA (ScaledObject abaixo).
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
        - name: flag
          imagePullPolicy: Never
          image: fiap-techchallenge-fase02-flag-service:latest
          envFrom:
            - configMapRef:
                name: configmap
            - secretRef:
                name: mysecret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8002

---
apiVersion: v1
kind: Service
metadata:
  name: flag
  namespace: flag
spec:
  selector:
    app: flag
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002

---
# KEDA: escala pelo uso de CPU (% do requests.cpu do container). Precisa do metrics-server.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: flag
  namespace: flag
spec:
  scaleTargetRef:
    name: flag
  minReplicaCount: 2
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
