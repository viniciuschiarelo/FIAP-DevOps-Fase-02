services:
  auth_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authuser
      POSTGRES_DB: authuser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authuser"]
      interval: 5s
      timeout: 5s
      retries: 5
  auth-service:
    build: ./auth-service
    container_name: auth_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgres://authuser:authuser@auth_db:5432/authuser?sslmode=disable
      - PORT=8001
      - MASTER_KEY=admin-secreto-123
    depends_on:
      auth_db:
        condition: service_healthy
  flags_db:
    image: postgres:16-alpine
    container_name: flags_db
    environment: 
      - POSTGRES_USER=flagsuser
      - POSTGRES_PASSWORD=flagsuser
      - POSTGRES_DB=flagsuser
    ports: 
      - "5433:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  flags_service:
    container_name: flags_service
    build: ./flag-service
    environment:
      - DATABASE_URL="postgres://flagsuser:flagsuser@localhost:5432/flagsuser"
      - PORT="8002"
      - AUTH_SERVICE_URL="http://localhost:8001"
    ports:
      - "8002:8002"
    depends_on:
      flags_db:
        condition: service_healthy
  targeting_db:
    image: postgres:16-alpine
    container_name: targeting_db
    environment: 
      POSTGRES_USER: targetinguser
      POSTGRES_PASSWORD: targetinguser
      POSTGRES_DB: targetinguser
    ports: 
      - "5434:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  targeting_service:
    build: ./targeting-service
    container_name: targeting_service
    environment:
      - DATABASE_URL="postgres://SEU_USUARIO:SUA_SENHA@localhost:5432/flags_db"
      - PORT="8003"
      - AUTH_SERVICE_URL="http://localhost:8003"
    ports:
      - "8003:8003"
    depends_on:
      targeting_db:
        condition: service_healthy


    

volumes:
  postgres_data:
