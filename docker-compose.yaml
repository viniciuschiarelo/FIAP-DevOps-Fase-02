name: togglemaster

networks:
  default:
    name: togglemaster

services:
  auth_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authuser
      POSTGRES_DB: authuser
    ports:
      - "5438:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authuser -d authuser" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build: ./auth-service
    container_name: auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgres://authuser:authuser@auth_db:5432/authuser?sslmode=disable
      - PORT=8001
      - MASTER_KEY=admin-secreto-123
    depends_on:
      auth_db:
        condition: service_healthy

  flags_db:
    image: postgres:16-alpine
    container_name: flags_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=flagsuser
      - POSTGRES_PASSWORD=flagsuser
      - POSTGRES_DB=flagsuser
    ports:
      - "5437:5432"
    volumes:
      - flags_postgres_data:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flagsuser -d flagsuser" ]
      interval: 5s
      timeout: 5s
      retries: 5

  flags_service:
    container_name: flags_service
    build: ./flag-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://flagsuser:flagsuser@flags_db:5432/flagsuser
      - PORT=8002
      - AUTH_SERVICE_URL=http://auth_service:8001
    ports:
      - "8002:8002"
    depends_on:
      flags_db:
        condition: service_healthy
      auth_service:
        condition: service_started

  targeting_db:
    image: postgres:16-alpine
    container_name: targeting_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: targetinguser
      POSTGRES_PASSWORD: targetinguser
      POSTGRES_DB: targetinguser
    ports:
      - "5436:5432"
    volumes:
      - targeting_postgres_data:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U targetinguser -d targetinguser" ]
      interval: 5s
      timeout: 5s
      retries: 5

  targeting_service:
    build: ./targeting-service
    container_name: targeting_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://targetinguser:targetinguser@targeting_db:5432/targetinguser
      - PORT=8003
      - AUTH_SERVICE_URL=http://auth_service:8001
    ports:
      - "8003:8003"
    depends_on:
      targeting_db:
        condition: service_healthy
      auth_service:
        condition: service_started

  evaluation_db:
    image: redis:8.10.1-alpine
    container_name: evaluation_db
    ports:
      - "6379:6379"
    command: redis-server --requirepass evaluationuser  --appendonly yes
    volumes:
      - evaluation_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "evaluationuser", "--raw", "incr", "ping" ]

  evaluation_service:
    build: ./evaluation-service
    container_name: evaluation_service
    restart: unless-stopped
    environment:
      - PORT=8004
      - REDIS_URL=redis://:evaluationuser@evaluation_db:6379
      - FLAG_SERVICE_URL=http://flags_service:8002
      - TARGETING_SERVICE_URL=http://targeting_service:8003
      - SERVICE_API_KEY=tm_key_af020d9f66b61544fa7e901f02b55437e5aa74bcfde9d8b4db5489e59c3efb64
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      - SQS_ENDPOINT=http://sqs-local:9324
      - AWS_SQS_URL=http://sqs-local:9324/000000000000/sua-fila
    ports:
      - "8004:8004"
    depends_on:
      evaluation_db:
        condition: service_healthy
      flags_service:
        condition: service_started
      targeting_service:
        condition: service_started
      sqs-local:
        condition: service_started

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8000" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  analytics_service:
    build: ./analytics-service
    container_name: analytics_service
    restart: unless-stopped
    ports:
      - "8005:8005"
    depends_on:
      dynamodb-local:
        condition: service_healthy
      sqs-local:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      - PORT=8005
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      - AWS_DYNAMODB_TABLE=ToggleMasterAnalytics
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - SQS_ENDPOINT=http://sqs-local:9324
      - AWS_SQS_URL=http://sqs-local:9324/000000000000/sua-fila

  dynamodb-init:
    image: amazon/aws-cli
    container_name: dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
    entrypoint: ["sh", "-c"]
    command: >
      "aws dynamodb create-table --table-name ToggleMasterAnalytics --attribute-definitions AttributeName=event_id,AttributeType=S --key-schema AttributeName=event_id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000 || exit 0"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    restart: unless-stopped
    ports:
      - "9002:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  sqs-local:
    image: softwaremill/elasticmq-native
    container_name: sqs-local
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    restart: unless-stopped

volumes:
  auth_postgres_data:
  flags_postgres_data:
  targeting_postgres_data:
  evaluation_redis_data:
